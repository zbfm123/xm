# ===================================================================
# 合同智能审查平台 · 主配置
# 敏感值一律走环境变量，不写进仓库（见 docs/README.md 笔记保存原则）
# ===================================================================
spring:
  application:
    name: contract-review

  # 默认不自动建表；开发环境用 -Dspring.profiles.active=dev 开启
  sql:
    init:
      mode: never

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 24MB

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      # 本机 Redis 已开启 requirepass（见 D:\redis\...\redis.windows.conf）
      password: ${REDIS_PASSWORD:}
      timeout: 2s

  # 静态资源响应类型：默认 text/html 不带 charset。
  # 虽然页面内有 <meta charset="UTF-8">，显式声明更规范，
  # 也避免 curl / 抓包工具按系统编码猜而把中文显示成乱码。
  web:
    resources:
      content-type:
        text/html: text/html;charset=UTF-8

server:
  port: 8080

# -------------------------------------------------------------------
# MyBatis-Plus
# -------------------------------------------------------------------
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted          # 逻辑删除字段
      logic-delete-value: 1
      logic-not-delete-value: 0

# -------------------------------------------------------------------
# 应用自定义配置
# -------------------------------------------------------------------
app:
  storage:
    # 本地文件存储目录（决策 D-09：不用 MinIO）
    root: ./data/files

  upload:
    max-size-bytes: 20971520              # 20MB，与 multipart 上限一致
    allowed-extensions: pdf,docx

  jwt:
    # ⚠️ 生产必须通过环境变量覆盖；仅本地开发有默认值
    #    HS256 要求密钥 >= 32 字节，JwtProperties 会校验并在不满足时启动失败
    secret: ${JWT_SECRET:local-dev-only-secret-change-me-please-32bytes}
    expire-minutes: 120
    issuer: contract-review
    # 连续失败 5 次锁定 15 分钟（对应 auth 模块的 ACCOUNT_LOCKED）
    max-failures: 5
    lock-minutes: 15

  # -----------------------------------------------------------------
  # AI 通道配置（决策 D-07、D-12）
  #   ai.enabled=false  → 走内置 Mock 桩：开发/测试零消耗，演示断网也能跑
  #   ai.enabled=true   → 真实调用 DeepSeek
  # 额度仅 15 元，真正的风险是调试时循环调用，故设次数上限与成本计数
  # -----------------------------------------------------------------
  ai:
    enabled: ${AI_ENABLED:false}
    # 通道模式：
    #   auto        —— 按 enabled 决定用 Mock 桩还是真实调用（默认）
    #   unavailable —— 显式不可用，用于**确定性地演示与验收降级路径**（I-04）
    #
    # 为什么需要 unavailable：Mock 桩设计成"永远可成功"，会掩盖降级路径；
    # 而不配 Key 也不行（会回退到 Mock）。降级是三个「绝不砍」项之一，
    # 必须有可复现的方式触发，否则演示只能靠运气。
    client-mode: ${AI_CLIENT_MODE:auto}
    base-url: https://api.deepseek.com
    api-key: ${DEEPSEEK_API_KEY:}
    model: deepseek-chat
    prompt-version: v1
    timeout-seconds: 60
    max-retries: 1                        # 失败最多重试 1 次（工作流纪律）
    max-calls-per-contract: 2             # 单份合同调用硬上限，超限即拒绝
    daily-budget-cny: 5.0                 # 日预算上限，超出直接拒绝而非静默降级
    cache-enabled: true

  workflow:
    low-confidence-threshold: 0.60
    # ⚠️ 这里曾有 high-confidence-threshold: 0.80，但**代码里零引用**（全仓 grep 无命中）。
    #    实际只做二分：< low-confidence-threshold 标 LOW_CONFIDENCE，否则 PENDING。
    #    留着一个从不生效的配置项比删掉更猜：读的人会以为真的有三档裁决。
    #    真要做三档时再加回来，并同时改到代码与测试里。

logging:
  level:
    root: INFO
    com.demo.contract: DEBUG
  # 脱敏纪律：不打合同全文、不打 token、不打 API Key
